query HobbyCon {
  hobbyCon {
    eventInfo {
      id
      startDate
      endDate
      vipStartDate
      vipEndDate
      location
      showButton
      price
      vipPrice
      buttonLabel
      buttonUrl
    }
    seo {
      metaTitle
      metaDescription
    }
    sections {
      title
      subText
      text
      Images {
        alternativeText
        height
        width
        url
        name
        caption
      }
      table
    }
  }
}
